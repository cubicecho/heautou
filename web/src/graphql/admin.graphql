fragment ClientFields on Client {
  clientId
  name
  clientSecret
  authMethod
  redirectUris
  postLogoutRedirectUris
  createdAt
}

fragment UserFields on User {
  id
  username
  email
  name
  groups
  createdAt
}

query Provider {
  provider {
    issuer
    discoveryUrl
    scopes
  }
}

query Clients {
  clients {
    ...ClientFields
  }
}

mutation CreateClient($input: NewClientInput!) {
  createClient(input: $input) {
    ...ClientFields
  }
}

mutation UpdateClient($clientId: ID!, $input: ClientInput!) {
  updateClient(clientId: $clientId, input: $input) {
    ...ClientFields
  }
}

mutation RotateClientSecret($clientId: ID!) {
  rotateClientSecret(clientId: $clientId) {
    ...ClientFields
  }
}

mutation DeleteClient($clientId: ID!) {
  deleteClient(clientId: $clientId) {
    clientId
  }
}

query Users {
  users {
    ...UserFields
  }
}

mutation CreateUser($input: NewUserInput!) {
  createUser(input: $input) {
    ...UserFields
  }
}

mutation UpdateUser($id: ID!, $input: UserInput!) {
  updateUser(id: $id, input: $input) {
    ...UserFields
  }
}

mutation SetUserPassword($id: ID!, $password: String!) {
  setUserPassword(id: $id, password: $password) {
    id
  }
}

mutation DeleteUser($id: ID!) {
  deleteUser(id: $id) {
    id
  }
}
