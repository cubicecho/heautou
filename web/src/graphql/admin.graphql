fragment ClientFields on Client {
  clientId
  name
  clientSecret
  authMethod
  redirectUris
  postLogoutRedirectUris
  allowedGroups
  groupsClaim
  allowClientCredentials
  allowDeviceFlow
  source
  logoUri
  createdAt
  refusedRedirectUris
  accessTokenSeconds
  idTokenSeconds
  refreshTokenSeconds
  backchannelLogoutUri
  backchannelLogoutSessionRequired
  preset
  app {
    id
    uri
  }
  # A client is on a few APIs. A page of 50 keeps the clients list within the server's cost limit.
  apis(limit: 50) {
    identifier
    name
  }
}

fragment PairingFields on Pairing {
  id
  status
  expiresAt
  allowedGroups
  groupsClaim
  client {
    ...ClientFields
  }
  finished
  offers {
    deviceClient {
      ...ClientFields
    }
    api {
      identifier
      name
      scopes
      existing {
        identifier
        name
      }
    }
  }
}

fragment UserFields on User {
  id
  username
  email
  name
  groups
  claims
  disabled
  hasPassword
  createdAt
  secondFactors {
    hasTotp
    recoveryCodesLeft
    passkeyCount
  }
  upstreamLinks {
    providerId
    provider {
      name
    }
    label
    linkedAt
    lastUsedAt
  }
  pictureUrl
}

query Provider {
  provider {
    issuer
    discoveryUrl
    scopes
  }
}

query Viewer {
  viewer {
    ...UserFields
  }
}

query Clients {
  clients {
    ...ClientFields
  }
}

mutation CreateClient($input: NewClientInput!) {
  createClient(input: $input) {
    ...ClientFields
  }
}

mutation UpdateClient($clientId: ID!, $input: ClientInput!) {
  updateClient(clientId: $clientId, input: $input) {
    ...ClientFields
  }
}

mutation RotateClientSecret($clientId: ID!) {
  rotateClientSecret(clientId: $clientId) {
    ...ClientFields
  }
}

mutation DeleteClient($clientId: ID!) {
  deleteClient(clientId: $clientId) {
    clientId
  }
}

mutation StartPairing($input: PairingInput!) {
  startPairing(input: $input) {
    setupUrl
    pairing {
      ...PairingFields
    }
  }
}

query Pairing($id: ID!) {
  pairing(id: $id) {
    ...PairingFields
  }
}

subscription PairingChanged($id: ID!) {
  pairingChanged(id: $id) {
    ...PairingFields
  }
}

mutation CancelPairing($id: ID!) {
  cancelPairing(id: $id)
}

mutation FinishPairing($id: ID!, $input: FinishPairingInput!) {
  finishPairing(id: $id, input: $input) {
    ...PairingFields
  }
}

query Users {
  users {
    ...UserFields
  }
}

mutation CreateUser($input: NewUserInput!) {
  createUser(input: $input) {
    ...UserFields
  }
}

mutation UpdateUser($id: ID!, $input: UserInput!) {
  updateUser(id: $id, input: $input) {
    ...UserFields
  }
}

mutation SetUserPassword($id: ID!, $password: String!) {
  setUserPassword(id: $id, password: $password) {
    id
  }
}

mutation DeleteUser($id: ID!) {
  deleteUser(id: $id) {
    id
  }
}

mutation SetUserDisabled($id: ID!, $disabled: Boolean!) {
  setUserDisabled(id: $id, disabled: $disabled) {
    ...UserFields
  }
}

query UserSessions($id: String!) {
  user(where: { id: { eq: $id } }) {
    id
    sessions {
      id
      signedInAt
      expiresAt
      clientNames
    }
  }
}

mutation EndUserSession($id: ID!, $sessionId: ID!) {
  endUserSession(id: $id, sessionId: $sessionId) {
    id
  }
}

mutation ResetSecondFactors($id: ID!) {
  resetSecondFactors(id: $id) {
    id
  }
}

mutation SignOutUser($id: ID!) {
  signOutUser(id: $id) {
    id
  }
}

mutation CreatePasswordLink($id: ID!) {
  createPasswordLink(id: $id) {
    url
    expiresAt
  }
}

query Groups {
  groups {
    name
    isProtected
    members {
      id
      username
    }
    clients {
      clientId
      name
    }
  }
}

mutation RenameGroup($name: String!, $newName: String!) {
  renameGroup(name: $name, newName: $newName) {
    name
  }
}

mutation DeleteGroup($name: String!) {
  deleteGroup(name: $name)
}

fragment KeysFields on Keys {
  rotatedAt
  signingKeys {
    kid
    isCurrent
  }
}

query Keys {
  keys {
    ...KeysFields
  }
}

mutation RotateKeys {
  rotateKeys {
    ...KeysFields
  }
}

fragment HttpRedirectsFields on HttpRedirects {
  isAllowed
  isSet
  isIssuerHttp
}

query TokenLifetimeDefaults {
  tokenLifetimeDefaults {
    accessTokenSeconds
    clientCredentialsSeconds
    idTokenSeconds
    refreshTokenSeconds
    minSeconds
    maxSeconds
  }
}

query HttpRedirects {
  httpRedirects {
    ...HttpRedirectsFields
  }
}

mutation SetHttpRedirects($allowed: Boolean) {
  setHttpRedirects(allowed: $allowed) {
    ...HttpRedirectsFields
  }
}

fragment PasswordRulesFields on PasswordRules {
  minScore
  checkBreaches
}

query PasswordRules {
  passwordRules {
    ...PasswordRulesFields
  }
}

mutation SetPasswordRules($minScore: Int, $checkBreaches: Boolean) {
  setPasswordRules(minScore: $minScore, checkBreaches: $checkBreaches) {
    ...PasswordRulesFields
  }
}

mutation SetBrandingName($name: String!) {
  setBrandingName(name: $name) {
    name
    logoUrl
  }
}

mutation SetBrandingLogo($dataUrl: String) {
  setBrandingLogo(dataUrl: $dataUrl) {
    name
    logoUrl
  }
}

fragment AuditEntryFields on AuditEntry {
  id
  at
  type
  actorUserId
  actorUsername
  ip
  targetKind
  targetId
  targetName
  detail
  cursor
}

query AuditEntries($limit: Int, $after: String, $where: AuditEntryFilters) {
  auditEntries(limit: $limit, after: $after, where: $where) {
    ...AuditEntryFields
  }
}

subscription AuditEntryAdded($type: AuditType, $userId: ID) {
  auditEntryAdded(type: $type, userId: $userId) {
    ...AuditEntryFields
  }
}

fragment UpstreamFields on Upstream {
  id
  name
  kind
  issuer
  clientId
  hasClientSecret
  scopes
  unknownIdentity
  createDomains
  createGroups
  countsAsBothFactors
  groupsClaim
  groupMappings {
    upstream
    local
  }
  redirectUri
  linksAggregate {
    count
  }
  createdAt
}

query Upstreams {
  upstreams {
    ...UpstreamFields
  }
}

query UpstreamRedirectUri($id: ID!) {
  upstreamRedirectUri(id: $id)
}

mutation CreateUpstream($id: ID!, $input: UpstreamInput!) {
  createUpstream(id: $id, input: $input) {
    ...UpstreamFields
  }
}

mutation UpdateUpstream($id: ID!, $input: UpstreamInput!) {
  updateUpstream(id: $id, input: $input) {
    ...UpstreamFields
  }
}

mutation DeleteUpstream($id: ID!) {
  deleteUpstream(id: $id) {
    id
  }
}

mutation UnlinkUserUpstream($id: ID!, $providerId: ID!) {
  unlinkUserUpstream(id: $id, providerId: $providerId) {
    id
  }
}

query ProfilePictures {
  profilePictures {
    isEnabled
    maxBytes
  }
}
