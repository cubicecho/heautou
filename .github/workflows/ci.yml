name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - run: npm ci
      # Generated files aren't in the tree, so codegen runs before anything reads them.
      - run: npm run codegen
      - name: Lint
        run: npx biome ci .
      - name: Typecheck
        run: npm run check:types
      - name: Test
        run: npm test

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: heautou, POSTGRES_PASSWORD: heautou, POSTGRES_DB: heautou }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U heautou" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://heautou:heautou@localhost:5432/heautou
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - name: The committed migrations match the tables
        run: npx drizzle-kit generate && test -z "$(git status --porcelain drizzle)"
      - name: The migrations apply to Postgres
        run: npm run db:migrate
      # One server per database: while it runs, a second, the backup CLI and db:migrate refuse it, without writing.
      - name: The server boots on Postgres, and a second process is refused
        run: |
          PORT=3100 ISSUER_URL=http://localhost:3100/oidc node server/index.ts > first.log 2>&1 &
          first=$!
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3100/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/healthz || { cat first.log; exit 1; }
          refused() {
            if "$@" > refused.log 2>&1; then
              echo "::error::$* ran while the server held the database"; cat refused.log; exit 1
            fi
            grep -q DATABASE_IN_USE refused.log || { cat refused.log; exit 1; }
          }
          PORT=3101 ISSUER_URL=http://localhost:3101/oidc refused node server/index.ts
          refused node server/backup.ts export backup.gz
          refused node server/db/migrate.ts
          kill -TERM "$first"
          wait "$first" || { cat first.log; exit 1; }
          node server/backup.ts export backup.gz

  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Loaded into the local daemon under the tag docker-compose.yml runs, so `up --no-build` uses it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/cubicecho/heautou:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # --wait blocks until the app's healthcheck passes.
      - name: Start the stack
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: /healthz answers
        run: curl -fsS http://127.0.0.1:3000/healthz
      - name: Discovery answers
        run: curl -fsS http://127.0.0.1:3000/oidc/.well-known/openid-configuration
      - name: Logs
        if: failure()
        run: docker compose logs
