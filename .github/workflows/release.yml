# Publishes to GHCR, which needs nothing beyond the built-in token.
# Docker Hub comes later: add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets, a login step and its tags.

name: Release

on:
  # After CI finishes on main, so a commit that fails its checks is never released.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Publishes the image for a version that already exists, without cutting a release.
  workflow_dispatch:
    inputs:
      version:
        description: The version to tag the image with, such as 1.2.0
        required: true

# One release at a time, in order: a second run waits, it does not cancel the first mid-push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # workflow_run fires for failed CI runs too.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release reads the whole history to work out what the last
          # release was and which commits have landed since.
          fetch-depth: 0
          # The commit CI passed, not whatever main has moved to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/changelog @semantic-release/npm @semantic-release/git @semantic-release/github

      # A dry run first, because most pushes to main release nothing — a docs
      # commit or a refactor analyses to no version bump — and the image steps
      # below must not run on a version that was never cut.
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$DISPATCH_VERSION" ]; then
            echo "version=$DISPATCH_VERSION" >> $GITHUB_OUTPUT
            echo "released=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          OUTPUT=$(npx semantic-release --dry-run 2>&1)
          echo "$OUTPUT"
          VERSION=$(echo "$OUTPUT" | grep -oP 'next release version is \K[0-9]+\.[0-9]+\.[0-9]+' || echo "")
          if [ -n "$VERSION" ]; then
            npx semantic-release
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.release.outputs.released == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.release.outputs.released == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` as well as the version, because that is the tag docker-compose.yml pulls.
      # Built from this checkout, where semantic-release has just written the version
      # into package.json, which is what /healthz reports.
      - name: Build and push
        if: steps.release.outputs.released == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.release.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
